name: Sykli CI (Dogfood)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sykli-ci.yml'
      - 'core/**'
      - 'sdk/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'test/**'
      - 'tests/**'
      - 'examples/**'
      - 'test_projects/**'
      - 'sykli.exs'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sykli-dogfood-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ERL_COMPILER_OPTIONS: "[deterministic]"

jobs:
  sykli:
    name: Run with Sykli
    runs-on: arc-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Elixir deps and build
        uses: actions/cache@v4
        with:
          path: |
            core/deps
            core/_build
          key: ${{ runner.os }}-dogfood-${{ hashFiles('core/mix.lock', '.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-dogfood-

      - name: Build Sykli from source
        run: |
          cd core
          mix deps.get
          mix escript.build
          sudo mv sykli /usr/local/bin/

      - name: Run Sykli Pipeline
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sykli delta
          else
            sykli
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  install-smoke:
    name: Released install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install released Sykli
        run: |
          tag="v$(cat VERSION)"
          install_dir="${RUNNER_TEMP}/sykli-bin"
          SYKLI_INSTALL_DIR="$install_dir" bash install.sh "$tag"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Smoke test installed binary
        run: |
          sykli --help
