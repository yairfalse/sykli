name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Run on PRs targeting main and on stacked PRs targeting a feature branch
    # (the Monster PR-train stacks phases on feature/ branches).
    branches: [main, 'feature/**']

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ERL_COMPILER_OPTIONS: "[deterministic]"

jobs:
  changes:
    name: Detect changes
    runs-on: arc-arm64
    outputs:
      core: ${{ steps.filter.outputs.core }}
      blackbox: ${{ steps.filter.outputs.blackbox }}
      conformance: ${{ steps.filter.outputs.conformance }}
      sdk_go: ${{ steps.filter.outputs.sdk_go }}
      sdk_rust: ${{ steps.filter.outputs.sdk_rust }}
      sdk_elixir: ${{ steps.filter.outputs.sdk_elixir }}
      sdk_typescript: ${{ steps.filter.outputs.sdk_typescript }}
      sdk_python: ${{ steps.filter.outputs.sdk_python }}
      integration: ${{ steps.filter.outputs.integration }}
      oracle: ${{ steps.filter.outputs.oracle }}
    steps:
      - uses: actions/checkout@v4

      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            core:
              - '.github/workflows/ci.yml'
              - 'core/**'
              - 'schemas/**'
              - 'scripts/**'
              - 'action.yml'
              - 'install.sh'
            blackbox:
              - '.github/workflows/ci.yml'
              - 'core/**'
              - 'sdk/**'
              - 'schemas/**'
              - 'scripts/**'
              - 'test/blackbox/**'
              - 'test_projects/**'
              - 'action.yml'
              - 'install.sh'
              - 'sykli.exs'
            conformance:
              - '.github/workflows/ci.yml'
              - 'sdk/**'
              - 'schemas/**'
              - 'scripts/gen-vocab.py'
              - 'tests/conformance/**'
              - 'VERSION'
            sdk_go:
              - '.github/workflows/ci.yml'
              - 'sdk/go/**'
            sdk_rust:
              - '.github/workflows/ci.yml'
              - 'sdk/rust/**'
            sdk_elixir:
              - '.github/workflows/ci.yml'
              - 'sdk/elixir/**'
            sdk_typescript:
              - '.github/workflows/ci.yml'
              - 'sdk/typescript/**'
            sdk_python:
              - '.github/workflows/ci.yml'
              - 'sdk/python/**'
            integration:
              - '.github/workflows/ci.yml'
              - 'core/**'
              - 'sdk/go/**'
              - 'examples/**'
            oracle:
              - '.github/workflows/ci.yml'
              - 'core/**'
              - 'schemas/**'
              - 'eval/oracle/**'

  core:
    name: Core Tests
    runs-on: arc-arm64
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.core == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: core/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('core/mix.lock') }}

      - name: Guardrail gate
        working-directory: core
        run: mix gate

      - name: Guardrail drift check
        run: sh scripts/check-guardrails-gate.sh

      - name: Build escript
        working-directory: core
        run: mix escript.build

  blackbox:
    name: Black-box Tests
    runs-on: arc-arm64
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.blackbox == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache core deps
        uses: actions/cache@v4
        with:
          path: core/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('core/mix.lock') }}

      - name: Install dependencies
        run: |
          python -m pip install jsonschema
          cd core && mix deps.get && mix escript.build
          cd ../sdk/elixir && mix deps.get
          cd ../typescript && npm ci

      - name: Run black-box suite
        run: test/blackbox/run.sh

  conformance:
    name: SDK Conformance
    runs-on: arc-arm64
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.conformance == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install jsonschema
          cd sdk/elixir && mix deps.get
          cd ../typescript && npm ci

      - name: Check vocabulary generation
        run: python scripts/gen-vocab.py --check

      - name: Run conformance suite
        env:
          SYKLI_CONFORMANCE_PYTHON: python
        run: tests/conformance/run.sh

  oracle:
    name: Oracle Eval
    runs-on: arc-arm64
    needs: changes
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      needs.changes.outputs.oracle == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install dependencies
        working-directory: core
        run: |
          mix deps.get
          mix escript.build

      - name: Run oracle eval
        run: eval/oracle/run.sh

  sdk-go:
    name: Go SDK Tests
    runs-on: arc-arm64
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.sdk_go == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Vet
        working-directory: sdk/go
        run: go vet ./...

      - name: Run tests
        working-directory: sdk/go
        run: go test ./...

  sdk-rust:
    name: Rust SDK Tests
    runs-on: arc-arm64
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.sdk_rust == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clippy
        working-directory: sdk/rust
        run: cargo clippy -- -D warnings

      - name: Run tests
        working-directory: sdk/rust
        run: cargo test

  sdk-elixir:
    name: Elixir SDK Tests
    runs-on: arc-arm64
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.sdk_elixir == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: sdk/elixir/deps
          key: ${{ runner.os }}-mix-elixir-sdk-${{ hashFiles('sdk/elixir/mix.lock') }}

      - name: Install dependencies
        working-directory: sdk/elixir
        run: mix deps.get

      - name: Check formatting
        working-directory: sdk/elixir
        run: mix format --check-formatted

      - name: Run tests
        working-directory: sdk/elixir
        run: mix test

  sdk-typescript:
    name: TypeScript SDK Tests
    runs-on: arc-arm64
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.sdk_typescript == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Type check
        working-directory: sdk/typescript
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: sdk/typescript
        run: npm test

  sdk-python:
    name: Python SDK Tests
    runs-on: arc-arm64
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.sdk_python == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SDK
        working-directory: sdk/python
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: sdk/python
        run: python -m pytest tests/

  integration:
    name: Integration Tests
    runs-on: arc-arm64
    needs: changes
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      needs.changes.outputs.integration == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build sykli
        working-directory: core
        run: |
          mix deps.get
          mix escript.build

      - name: Test Go example
        working-directory: core
        run: ./sykli ../examples/go-project
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Test Elixir example
        working-directory: core
        run: ./sykli ../examples/elixir-project
        continue-on-error: true  # May fail without actual Elixir project files
