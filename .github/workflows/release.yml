name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  ERL_COMPILER_OPTIONS: "+deterministic"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
            burrito_target: linux_x86_64
          - target: linux-aarch64
            os: ubuntu-latest
            burrito_target: linux_aarch64
          - target: macos-x86_64
            os: macos-15-intel
            burrito_target: macos_x86_64
          - target: macos-aarch64
            os: macos-14
            burrito_target: macos_aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig (Linux)
        if: runner.os == 'Linux'
        run: |
          wget https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          tar -xf zig-x86_64-linux-0.15.2.tar.xz
          echo "$PWD/zig-x86_64-linux-0.15.2" >> $GITHUB_PATH

      - name: Install Zig (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install xz
          case "${{ matrix.burrito_target }}" in
            macos_x86_64) zig_arch="x86_64-macos" ;;
            macos_aarch64) zig_arch="aarch64-macos" ;;
            *) echo "unsupported macOS target: ${{ matrix.burrito_target }}" && exit 1 ;;
          esac
          curl -fsSLO "https://ziglang.org/download/0.15.2/zig-$zig_arch-0.15.2.tar.xz"
          tar -xf "zig-$zig_arch-0.15.2.tar.xz"
          echo "$PWD/zig-$zig_arch-0.15.2" >> $GITHUB_PATH

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '26.2.5.14'
          elixir-version: '1.17.3'

      - name: Install dependencies
        working-directory: core
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Build release
        working-directory: core
        env:
          MIX_ENV: prod
          BURRITO_TARGET: ${{ matrix.burrito_target }}
        run: mix release sykli --overwrite

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sykli-${{ matrix.target }}
          path: core/burrito_out/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in artifacts/sykli-*/; do
            target=$(basename "$dir" | sed 's/sykli-//')
            cp "$dir"/* "release/sykli-$target" 2>/dev/null || true
          done
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum sykli-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          body_path: docs/releases/${{ github.ref_name }}.md
          make_latest: true

  # ── Registry publishing ──────────────────────────────────────────────
  # Tokenless where the registry supports OIDC trusted publishing.
  # One-time registry-side setup is documented in RELEASE.md §"Automated
  # registry publishing". These jobs run after the GitHub release exists,
  # so a registry failure never blocks the binary release.

  publish-go:
    name: Publish Go SDK (module tag)
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Push module-aware tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag="sdk/go/v${version}"
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi

  publish-pypi:
    name: Publish Python SDK (PyPI trusted publishing)
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build distributions
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist

  publish-crates:
    name: Publish Rust SDK (crates.io trusted publishing)
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: cargo publish
        working-directory: sdk/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish

  # npm trusted publishing can only be configured on a package that already
  # exists, and the sykli package has not had its first publish yet. After
  # the first manual `npm publish` from sdk/typescript: configure the
  # trusted publisher on npmjs.com (package Settings → Trusted publisher:
  # GitHub Actions, repository false-systems/sykli, workflow release.yml),
  # then uncomment this job. Requires npm >= 11.5 on the runner (OIDC).
  #
  # publish-npm:
  #   name: Publish TypeScript SDK (npm trusted publishing)
  #   needs: release
  #   runs-on: ubuntu-latest
  #   permissions:
  #     id-token: write
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: '22'
  #         registry-url: 'https://registry.npmjs.org'
  #     - name: Publish to npm
  #       working-directory: sdk/typescript
  #       run: |
  #         npm install -g npm@latest
  #         npm publish
